<div style="max-width: 1000px; margin: 24px auto; font-family: 'Segoe UI', sans-serif; text-align: center; color: #fff;">
  <style>
    .countdowns{display: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;}    /* ======= ESTILOS DE LA TARJETA DEL COUNTDOWN ======= */
      .cd-card{background: linear-gradient(135deg, #0f0f0f, #1a1a1a); /* Fondo oscuro (puedes cambiar aquí los colores) */
      border-radius: 12px;
      padding: 20px;
      min-width: 280px;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);} /* Sombra (ajustar si cambias fondo) */
      .cd-title{font-size: 16px; 
      margin-bottom: 8px;}.badge{display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      margin-bottom: 6px;}

      /* ======= COLORES PARA CADA EVENTO (CAMBIA ESTOS SI NECESITAS) ======= */
      .halloween{background: #ff9100; color: #fff;} /* Color de fondo del badge para Halloween o evento */ /* Color del texto dentro del badge */
      .cd-timer{font-size: 22px; 
      font-weight: bold;
      text-shadow: 0 0 6px #aaa;} /* Efecto de brillo */
      .cd-note{margin-top: 20px;
      font-size: 15px; 
      color: #f0f0f0;} /* Texto aclaratorio */
      .cd-today{color: #00ff99;
      text-shadow: 0 0 10px #00ff9977;}</style>

  <!-- CONTENEDOR DE COUNTDOWN -->
  <div class="countdowns">
    <div class="cd-card">
      <div class="cd-title">
        <span class="badge halloween">BLACK FRIDAY</span><br>
        <span>25 de Noviembre</span>
      </div>
      <div class="cd-timer" id="timer-halloween">--d --:--:--</div>
    </div>
     <!-- nota debajo del contenedor -->
  <div class="cd-note">Ese día con <strong>descuentos especiales</strong> en tu sucursal.</div>

  <script data-skip-moving="true">
      // Función para obtener la fecha objetivo
    function getNextDate(month, day){const now = new Date();
      let target = new Date(now.getFullYear(), month, day, 0, 0, 0);
      if (now > target) target.setFullYear(target.getFullYear() + 1);
      return target;}
      // Formatea el tiempo restante
    function formatTimeLeft(ms){if (ms <= 0) return '<span class="cd-today">¡Hoy!</span>';
      const totalSec = Math.floor(ms / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = String(Math.floor((totalSec % 86400) / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${d}d ${h}:${m}:${s}`;}
    // Inicia el conteo regresivo
    function startCountdown(id, targetDate){const el = document.getElementById(id);
      if (!el) return;
      function update(){const now = new Date();
        const delta = targetDate - now;
        el.innerHTML = formatTimeLeft(delta);}update();
      setInterval(update, 1000);}(window.BX ? BX.ready : (fn => document.addEventListener('DOMContentLoaded', fn)))(function (){startCountdown("timer-halloween", getNextDate(11, 25));
  startCountdown("timer-muertos", getNextDate(11, 15));});   // Noviembre = 10});
  </script>
</div>
