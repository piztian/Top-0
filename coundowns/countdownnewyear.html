<div id="ny-wrap" style="max-width:1100px;margin:24px auto;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif;color:#fff;position:relative">
  <style>
    /* ===== Fondo nocturno ===== */
    #ny-wrap{
      background: radial-gradient(1200px 600px at 50% -10%, #0a0f1c 0%, #050a15 45%, #02060f 100%);
      border-radius:16px; padding:28px 18px; overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.55);
    }

    /* ===== Fuegos artificiales ===== */
    .sky{position:absolute; inset:0; pointer-events:none; z-index:1; overflow:hidden}
    .fw-burst{position:absolute; width:2px; height:2px; left:var(--x); top:var(--y)}
    .fw-p{
      position:absolute; left:0; top:0; width:6px; height:6px; border-radius:50%;
      background:var(--c, #ffd54f); opacity:0; transform:translate(0,0) scale(0.6);
      filter:drop-shadow(0 0 8px var(--c, #ffd54f));
      animation: fw 900ms ease-out forwards;
    }
    @keyframes fw{
      0%   {opacity:0; transform:translate(0,0) scale(0.3)}
      10%  {opacity:1}
      100% {opacity:0; transform:translate(var(--tx),var(--ty)) scale(1)}
    }

    /* ===== Contenido ===== */
    .ny-inner{position:relative; z-index:2; text-align:center}
    .badge{
      display:inline-block; padding:6px 14px; border-radius:999px;
      background:linear-gradient(90deg,#ffe082,#ffd54f);
      color:#1a1300; font-weight:800; letter-spacing:.5px; font-size:12px; text-transform:uppercase;
      box-shadow:0 0 18px rgba(255,213,79,.35), inset 0 0 10px rgba(255,255,255,.35);
    }
    .title{
      font-size:clamp(24px,3.2vw,38px); margin:14px 0 6px; font-weight:900;
      text-shadow:0 0 22px rgba(255,213,79,.35), 0 0 4px rgba(255,213,79,.5);
    }
    .subtitle{opacity:.9; margin-bottom:22px}
    .hl{color:#ffd54f}

    .timer{
      display:grid; grid-template-columns:repeat(4,minmax(110px,1fr)); gap:14px; justify-content:center;
      max-width:820px; margin:0 auto 10px;
    }
    .unit{
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
      border:1px solid rgba(255,213,79,.28);
      border-radius:16px; padding:16px 10px;
      backdrop-filter: blur(4px);
      box-shadow: inset 0 0 18px rgba(255,213,79,.12), 0 10px 20px rgba(0,0,0,.25);
    }
    .num{font-size:clamp(28px,5.5vw,46px); font-weight:900; letter-spacing:.5px}
    .lab{opacity:.85; font-size:12px; letter-spacing:.8px; text-transform:uppercase; margin-top:6px}

    .cta{margin-top:18px; font-size:14px; opacity:.95}

    @media (max-width:640px){
      .timer{grid-template-columns:repeat(2,1fr)}
    }
  </style>

  <!-- Cielo para fuegos artificiales -->
  <div class="sky" id="ny-sky" aria-hidden="true"></div>

  <div class="ny-inner">
    <span class="badge">Cuenta regresiva</span>
    <h2 class="title">🎆 Fin de Año llega en…</h2>
    <div class="subtitle">Despidamos el año con <span class="hl">alegría</span> y mucha energía ✨</div>

    <div class="timer" id="ny-timer">
      <div class="unit"><div class="num" data-part="days">--</div><div class="lab">Días</div></div>
      <div class="unit"><div class="num" data-part="hours">--</div><div class="lab">Horas</div></div>
      <div class="unit"><div class="num" data-part="mins">--</div><div class="lab">Minutos</div></div>
      <div class="unit"><div class="num" data-part="secs">--</div><div class="lab">Segundos</div></div>
    </div>

    <div class="cta" id="ny-cta">Contando para el <b>31 de diciembre</b> a las 23:59:59.</div>
  </div>

  <script data-skip-moving="true">
    (function(){
      /* ===== Target: 31 de diciembre 23:59:59 ===== */
      function nextNewYearEve(){
        const now = new Date();
        let y = now.getFullYear();
        const t = new Date(y, 11, 31, 23, 59, 59, 0);
        if (now >= t) return new Date(y + 1, 11, 31, 23, 59, 59, 0);
        return t;
      }

      /* ===== Helpers ===== */
      const $ = (s, c=document) => c.querySelector(s);
      const pad = n => String(n).padStart(2,'0');
      function parts(ms){
        const total = Math.max(0, Math.floor(ms/1000));
        return {
          days: Math.floor(total/86400),
          hrs : Math.floor((total%86400)/3600),
          mins: Math.floor((total%3600)/60),
          secs: total%60
        };
      }
      function render(target){
        const box = $("#ny-timer"); if(!box) return;
        const now = new Date(); const d = parts(target - now);
        box.querySelector("[data-part='days']").textContent  = d.days;
        box.querySelector("[data-part='hours']").textContent = pad(d.hrs);
        box.querySelector("[data-part='mins']").textContent  = pad(d.mins);
        box.querySelector("[data-part='secs']").textContent  = pad(d.secs);
        if (target - now <= 0){
          $(".title").innerHTML = "🎉 ¡Feliz Año Nuevo!";
          $("#ny-cta").innerHTML = "Damos la bienvenida al <b>" + (new Date().getFullYear()+1) + "</b> 🎇";
          clearInterval(window.__nytick__);
          celebrate();
        }
      }

      /* ===== Fuegos artificiales ===== */
      const COLORS = ["#ffd54f","#ff8a65","#81d4fa","#ce93d8","#80cbc4","#f06292"];
      function spawnFirework(){
        const sky = $("#ny-sky"); if(!sky) return;
        const vw = sky.clientWidth, vh = sky.clientHeight;
        const x = Math.random() * (vw*0.8) + vw*0.1;
        const y = Math.random() * (vh*0.4) + vh*0.1;
        const c = COLORS[Math.floor(Math.random()*COLORS.length)];

        const burst = document.createElement("div");
        burst.className = "fw-burst";
        burst.style.setProperty("--x", x + "px");
        burst.style.setProperty("--y", y + "px");

        const particles = 18 + Math.floor(Math.random()*12);
        for(let i=0;i<particles;i++){
          const p = document.createElement("i");
          p.className = "fw-p";
          const angle = (Math.PI*2)*(i/particles)+(Math.random()*0.4-0.2);
          const dist = 60 + Math.random()*60;
          const tx = Math.cos(angle)*dist;
          const ty = Math.sin(angle)*dist;
          p.style.setProperty("--tx", tx+"px");
          p.style.setProperty("--ty", ty+"px");
          p.style.setProperty("--c", c);
          p.style.animationDelay = (Math.random()*100)+"ms";
          burst.appendChild(p);
        }
        sky.appendChild(burst);
        setTimeout(()=>sky.removeChild(burst),1200);
      }

      function loopFireworks(){ window.__nyfw__ = setInterval(spawnFirework, 1000); }
      function celebrate(){ spawnFirework(); setTimeout(spawnFirework, 300); setTimeout(spawnFirework, 600); }

      /* ===== Init ===== */
      document.addEventListener("DOMContentLoaded", ()=>{
        const target = nextNewYearEve();
        const y = target.getFullYear();
        $("#ny-cta").innerHTML = `Contando para el <b>31 de diciembre de ${y}</b> a las 23:59:59.`;
        render(target);
        window.__nytick__ = setInterval(()=>render(target), 1000);
        loopFireworks();
      });
    })();
  </script>
</div>
